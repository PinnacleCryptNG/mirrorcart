# Hourly retention sweep. Vercel Hobby only allows daily crons (vercel.json keeps a daily backstop),
# so GitHub Actions calls the same authenticated endpoint every hour.
name: retention-sweep
on:
  schedule: [{ cron: "7 * * * *" }]
  workflow_dispatch: {}
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ vars.MIRRORCART_URL || 'https://mirrorcart.vercel.app' }}/api/cron/retention"
