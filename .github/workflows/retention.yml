# Hourly retention sweep. Vercel Hobby only allows daily crons (vercel.json keeps a daily backstop),
# so GitHub Actions pings the same endpoint every hour. The endpoint only deletes data older than 24 h.
name: retention-sweep
on:
  schedule: [{ cron: "7 * * * *" }]
  workflow_dispatch: {}
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ vars.MIRRORCART_URL || 'https://mirrorcart.vercel.app' }}/api/cron/retention"
